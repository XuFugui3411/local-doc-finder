name: Build Windows release
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: local-doc-finder-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Run frontend regression tests
        run: node --test tests/test_frontend.cjs
      - name: Build and verify Windows executable
        run: python tools/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: LocalDocFinder-windows-x64
          path: releases/*
          if-no-files-found: error
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $version = python -c "from tools.build_windows import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseTag = "v$version"
          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $releaseTag already exists; keeping published files."
            exit 0
          }
          $releaseAssets = @(Get-ChildItem releases -File | ForEach-Object { $_.FullName })
          gh release create $releaseTag @releaseAssets --target $env:GITHUB_SHA --title "Local Doc Finder $releaseTag" --notes-file docs/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
